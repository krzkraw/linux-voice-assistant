<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LVA Audio Tuning</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="title"><h1>Audio tuning</h1><span>Linux Voice Assistant</span></div>
      <div class="status"><span id="connection" class="dot"></span><span id="connection-text">Connecting</span></div>
    </header>
    <section id="login" hidden>
      <h2>Sign in</h2>
      <form id="login-form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
      <p id="login-error" class="error" role="alert"></p>
    </section>
    <div id="controls" hidden>
      <section class="score-section" aria-labelledby="monitor-title">
        <div class="section-heading"><h2 id="monitor-title">Wake-word score</h2><div class="graph-legend"><span>● score</span><span>━ accepted</span><span>┄ threshold</span></div></div>
        <canvas id="score-graph" role="img" aria-label="Primary wake-word scores, threshold, accepted activations, and audio gaps"></canvas>
        <div class="monitor-meta"><span id="monitor-model">—</span><span>Threshold <strong id="monitor-threshold">—</strong></span><span>Revision <strong id="monitor-revision">—</strong></span></div>
      </section>
      <section class="microphone-section" aria-labelledby="microphone-title">
        <h2 id="microphone-title">Microphone</h2>
        <div class="microphone-layout">
          <div class="sliders">
            <div class="control"><label for="mic_volume">Volume <output id="mic_volume-value"></output></label><input id="mic_volume" type="range" min="1" max="100" step="1"></div>
            <div class="control"><label for="mic_auto_gain">Auto gain <output id="mic_auto_gain-value"></output></label><input id="mic_auto_gain" type="range" min="0" max="31" step="1"></div>
            <div class="control"><label for="mic_noise_suppression">Noise suppression <output id="mic_noise_suppression-value"></output></label><input id="mic_noise_suppression" type="range" min="0" max="4" step="1"></div>
          </div>
          <div class="level-meters" aria-label="Live audio peaks">
            <div class="level-meter"><label for="input-meter">Input</label><div class="meter-track"><meter id="input-meter" min="-90" max="0" low="-12" high="-3" optimum="-90" value="-90" aria-label="Input peak in dBFS"></meter></div><strong id="input-level">—</strong><small id="input-clips">—</small></div>
            <div class="meter-scale" aria-hidden="true"><span>0</span><span>−18</span><span>−36</span><span>−54</span><span>−72</span><span>−90</span></div>
            <div class="level-meter"><label for="processed-meter">Processed</label><div class="meter-track"><meter id="processed-meter" min="-90" max="0" low="-12" high="-3" optimum="-90" value="-90" aria-label="Processed peak in dBFS"></meter></div><strong id="processed-level">—</strong><small id="processed-clips">—</small></div>
          </div>
        </div>
      </section>
      <div class="settings-row">
        <section aria-labelledby="detection-title"><h2 id="detection-title">Detection</h2>
          <div class="control"><label for="primary_model">Primary model</label><select id="primary_model"></select></div>
          <div class="control"><label for="primary_threshold">Threshold <output id="primary_threshold-value"></output></label><input id="primary_threshold" type="range" min="0" max="1" step="0.001"></div>
          <label class="mute-row" for="muted"><input id="muted" type="checkbox" aria-describedby="mute-description">Mute assistant</label><small id="mute-description">Pauses voice input and diagnostics.</small>
        </section>
        <section aria-labelledby="listening-title"><div class="section-heading"><h2 id="listening-title">Monitor</h2><div class="monitor-actions"><button id="monitor-start" type="button">Start monitoring</button><button id="monitor-stop" class="quiet" type="button" disabled>Stop</button></div></div>
          <div class="control"><label for="listen-feed">Listen to</label><select id="listen-feed"><option value="input">Input capture</option><option value="processed">Processed detector audio</option></select></div>
          <div class="control"><label for="listen-volume">Listening volume <output id="listen-volume-value">50</output></label><input id="listen-volume" type="range" min="0" max="100" value="50"></div>
          <div class="monitor-stats"><span id="monitor-status" role="status">Stopped</span><span id="detector-status">Waiting for audio</span><span>Gaps <strong id="gap-count">0</strong></span><span><span id="source-rate">16000</span> / <span id="output-rate">—</span> Hz</span></div>
        </section>
      </div>
      <footer><p id="message" role="status"></p><button id="logout" class="quiet" type="button">Sign out</button></footer>
    </div>
  </main>
</body>
</html>
